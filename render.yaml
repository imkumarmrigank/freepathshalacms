services:
  - type: web
    name: freepathshala-cms
    runtime: node
    plan: free            # free instances sleep after 15 min idle; upgrade to starter to keep warm
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    # Migrations run on every boot; schema_migrations makes already-applied files a no-op.
    startCommand: npm run migrate && npm start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # Neon pooled connection string
        sync: false
      - key: JWT_SECRET            # generated once, then kept across deploys
        generateValue: true
      - key: ENROLLMENT_PREFIX
        value: FP
      - key: CRON_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22.15.0"

